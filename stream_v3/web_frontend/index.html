<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stream V3 - 智能监控系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <style>
        :root {
            --primary-color: #0d6efd;
            --secondary-color: #6c757d;
            --success-color: #198754;
            --danger-color: #dc3545;
            --warning-color: #ffc107;
            --dark-bg: #1a1d21;
            --card-bg: #252a30;
            --border-color: #3d4349;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            background-color: var(--dark-bg);
            color: #e9ecef;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
        }
        
        /* 顶部导航 */
        .navbar {
            background: linear-gradient(135deg, #1e3a5f 0%, #0d2844 100%);
            border-bottom: 1px solid var(--border-color);
            padding: 0.75rem 0;
        }
        
        .navbar-brand {
            font-weight: 600;
            font-size: 1.25rem;
            color: #fff !important;
        }
        
        .navbar-brand i {
            color: var(--primary-color);
        }
        
        /* 侧边栏 */
        .sidebar {
            background-color: var(--card-bg);
            border-right: 1px solid var(--border-color);
            min-height: calc(100vh - 56px);
            padding: 1rem;
        }
        
        .sidebar-menu {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        
        .sidebar-menu li {
            margin-bottom: 0.25rem;
        }
        
        .sidebar-menu a {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            color: #adb5bd;
            text-decoration: none;
            border-radius: 0.5rem;
            transition: all 0.2s;
        }
        
        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: var(--primary-color);
            color: #fff;
        }
        
        .sidebar-menu i {
            margin-right: 0.75rem;
            font-size: 1.1rem;
        }
        
        /* 主内容区 */
        .main-content {
            padding: 1.5rem;
        }
        
        /* 卡片样式 */
        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            margin-bottom: 1rem;
        }
        
        .card-header {
            background-color: transparent;
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
            font-weight: 600;
        }
        
        .card-body {
            padding: 1.25rem;
        }
        
        /* 视频流卡片 */
        .stream-card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .stream-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        
        .stream-card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: rgba(0,0,0,0.2);
        }
        
        .stream-card-body {
            position: relative;
            background-color: #000;
            aspect-ratio: 16/9;
        }
        
        .stream-card-body img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        
        .stream-status {
            position: absolute;
            top: 0.5rem;
            right: 0.5rem;
            padding: 0.25rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .stream-status.running {
            background-color: var(--success-color);
            color: #fff;
        }
        
        .stream-status.stopped {
            background-color: var(--secondary-color);
            color: #fff;
        }
        
        .stream-card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0.75rem 1rem;
            background-color: rgba(0,0,0,0.2);
        }
        
        .stream-info {
            display: flex;
            gap: 1rem;
            font-size: 0.8rem;
            color: #adb5bd;
        }
        
        /* 按钮样式 */
        .btn-primary {
            background-color: var(--primary-color);
            border: none;
            padding: 0.5rem 1.25rem;
            border-radius: 0.5rem;
        }
        
        .btn-primary:hover {
            background-color: #0b5ed7;
        }
        
        .btn-icon {
            width: 36px;
            height: 36px;
            padding: 0;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 0.5rem;
        }
        
        /* 统计卡片 */
        .stats-card {
            background: linear-gradient(135deg, var(--card-bg) 0%, #2d333b 100%);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1.25rem;
            text-align: center;
        }
        
        .stats-card .stats-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary-color);
        }
        
        .stats-card .stats-label {
            font-size: 0.85rem;
            color: #adb5bd;
            margin-top: 0.25rem;
        }
        
        /* 违规列表 */
        .violation-item {
            display: flex;
            align-items: center;
            padding: 1rem;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.2s;
        }
        
        .violation-item:hover {
            background-color: rgba(255,255,255,0.05);
        }
        
        .violation-item:last-child {
            border-bottom: none;
        }
        
        .violation-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 1rem;
            font-size: 1.25rem;
        }
        
        .violation-icon.high {
            background-color: rgba(220, 53, 69, 0.2);
            color: var(--danger-color);
        }
        
        .violation-icon.medium {
            background-color: rgba(255, 193, 7, 0.2);
            color: var(--warning-color);
        }
        
        .violation-icon.low {
            background-color: rgba(108, 117, 125, 0.2);
            color: var(--secondary-color);
        }
        
        .violation-content {
            flex: 1;
        }
        
        .violation-title {
            font-weight: 600;
            margin-bottom: 0.25rem;
        }
        
        .violation-meta {
            font-size: 0.8rem;
            color: #adb5bd;
        }
        
        /* 表单样式 */
        .form-control, .form-select {
            background-color: #1a1d21;
            border: 1px solid var(--border-color);
            color: #e9ecef;
            border-radius: 0.5rem;
            padding: 0.625rem 1rem;
        }
        
        .form-control:focus, .form-select:focus {
            background-color: #1a1d21;
            border-color: var(--primary-color);
            color: #e9ecef;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25);
        }
        
        .form-label {
            color: #adb5bd;
            font-size: 0.875rem;
            margin-bottom: 0.5rem;
        }
        
        /* 模态框 */
        .modal-content {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 1rem;
        }
        
        .modal-header {
            border-bottom: 1px solid var(--border-color);
            padding: 1.25rem;
        }
        
        .modal-title {
            color: #e9ecef;
        }
        
        .modal-body {
            padding: 1.25rem;
        }
        
        .modal-footer {
            border-top: 1px solid var(--border-color);
            padding: 1rem 1.25rem;
        }
        
        /* 标签 */
        .badge-severity {
            padding: 0.35rem 0.75rem;
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        .badge-high {
            background-color: rgba(220, 53, 69, 0.2);
            color: var(--danger-color);
        }
        
        .badge-medium {
            background-color: rgba(255, 193, 7, 0.2);
            color: var(--warning-color);
        }
        
        .badge-low {
            background-color: rgba(108, 117, 125, 0.2);
            color: var(--secondary-color);
        }
        
        /* 加载动画 */
        .loading-spinner {
            display: inline-block;
            width: 1rem;
            height: 1rem;
            border: 2px solid rgba(255,255,255,0.3);
            border-radius: 50%;
            border-top-color: #fff;
            animation: spin 0.8s linear infinite;
        }
        
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar {
                display: none;
            }
            
            .main-content {
                padding: 1rem;
            }
        }
        
        /* 滚动条 */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        
        ::-webkit-scrollbar-track {
            background: var(--dark-bg);
        }
        
        ::-webkit-scrollbar-thumb {
            background: var(--border-color);
            border-radius: 4px;
        }
        
        ::-webkit-scrollbar-thumb:hover {
            background: var(--secondary-color);
        }
        
        /* 空状态 */
        .empty-state {
            text-align: center;
            padding: 3rem 1rem;
            color: #adb5bd;
        }
        
        .empty-state i {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }
        
        /* 检测器标签 */
        .detector-tag {
            display: inline-flex;
            align-items: center;
            padding: 0.25rem 0.75rem;
            background-color: rgba(13, 110, 253, 0.2);
            color: var(--primary-color);
            border-radius: 1rem;
            font-size: 0.75rem;
            font-weight: 600;
        }
        
        /* 实时状态指示 */
        .live-indicator {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            color: var(--success-color);
        }
        
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--success-color);
            border-radius: 50%;
            animation: pulse 1.5s infinite;
        }
        
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <!-- 导航栏 -->
    <nav class="navbar navbar-expand-lg navbar-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">
                <i class="bi bi-shield-check me-2"></i>
                Stream V3
            </a>
            <div class="d-flex align-items-center">
                <div class="live-indicator me-3" id="connectionStatus">
                    <span class="live-dot"></span>
                    <span>连接中...</span>
                </div>
                <button class="btn btn-primary btn-sm" onclick="showAddStreamModal()">
                    <i class="bi bi-plus-lg me-1"></i>添加视频流
                </button>
            </div>
        </div>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <!-- 侧边栏 -->
            <div class="col-md-2 sidebar d-none d-md-block">
                <ul class="sidebar-menu">
                    <li>
                        <a href="#" class="active" onclick="showPage('streams')">
                            <i class="bi bi-camera-video"></i>视频流
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="showPage('violations')">
                            <i class="bi bi-exclamation-triangle"></i>违规记录
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="showPage('stats')">
                            <i class="bi bi-bar-chart"></i>统计分析
                        </a>
                    </li>
                    <li>
                        <a href="#" onclick="showPage('settings')">
                            <i class="bi bi-gear"></i>系统设置
                        </a>
                    </li>
                </ul>
                <!-- 调试信息 -->
                <div class="mt-4 p-2" style="font-size: 0.7rem; color: #6c757d; border-top: 1px solid var(--border-color);">
                    <div id="debugInfo">调试信息:</div>
                </div>
            </div>
            
            <!-- 主内容区 -->
            <div class="col-md-10 main-content">
                <!-- 视频流页面 -->
                <div id="page-streams">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="mb-0">视频流监控</h4>
                        <div class="btn-group">
                            <button class="btn btn-outline-secondary btn-sm" onclick="refreshStreams()">
                                <i class="bi bi-arrow-clockwise"></i>
                            </button>
                        </div>
                    </div>
                    
                    <!-- 统计卡片 -->
                    <div class="row mb-4">
                        <div class="col-md-3">
                            <div class="stats-card">
                                <div class="stats-value" id="totalStreams">0</div>
                                <div class="stats-label">总视频流</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stats-card">
                                <div class="stats-value" id="runningStreams">0</div>
                                <div class="stats-label">运行中</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stats-card">
                                <div class="stats-value" id="totalViolations">0</div>
                                <div class="stats-label">今日违规</div>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="stats-card">
                                <div class="stats-value" id="totalDetections">0</div>
                                <div class="stats-label">总检测数</div>
                            </div>
                        </div>
                    </div>
                    
                    <!-- 视频流网格 -->
                    <div class="row" id="streamsGrid">
                        <!-- 动态加载 -->
                    </div>
                </div>
                
                <!-- 违规记录页面 -->
                <div id="page-violations" style="display: none;">
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <h4 class="mb-0">违规记录</h4>
                        <button class="btn btn-outline-secondary btn-sm" onclick="loadViolations()">
                            <i class="bi bi-arrow-clockwise"></i> 刷新
                        </button>
                    </div>
                    
                    <div class="card">
                        <div class="card-body p-0">
                            <div id="violationsList">
                                <!-- 动态加载 -->
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 统计分析页面 -->
                <div id="page-stats" style="display: none;">
                    <h4 class="mb-4">统计分析</h4>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">违规类型分布</div>
                                <div class="card-body">
                                    <canvas id="chartByType" height="250"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="card">
                                <div class="card-header">摄像头分布</div>
                                <div class="card-body">
                                    <canvas id="chartByCamera" height="250"></canvas>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- 系统设置页面 -->
                <div id="page-settings" style="display: none;">
                    <h4 class="mb-4">系统设置</h4>
                    <div class="card">
                        <div class="card-header">可用检测器</div>
                        <div class="card-body">
                            <div id="detectorsList">
                                <!-- 动态加载 -->
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 添加视频流模态框 -->
    <div class="modal fade" id="addStreamModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">添加视频流</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addStreamForm">
                        <div class="mb-3">
                            <label class="form-label">流名称</label>
                            <input type="text" class="form-control" id="streamName" required placeholder="例如：工地大门">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">视频流地址</label>
                            <input type="text" class="form-control" id="streamUrl" required placeholder="rtmp:// 或 rtsp://">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">选择检测器</label>
                            <select class="form-select" id="streamDetector" required>
                                <!-- 动态加载 -->
                            </select>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="addStream()">添加</button>
                </div>
            </div>
        </div>
    </div>
    
    <!-- 视频流详情模态框 -->
    <div class="modal fade" id="streamDetailModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="detailStreamName">视频流详情</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-0">
                    <div class="position-relative">
                        <img id="detailStreamImage" src="" alt="视频流" style="width: 100%;">
                        <div class="position-absolute top-0 end-0 p-2">
                            <span class="stream-status running" id="detailStreamStatus">运行中</span>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-danger" id="detailDeleteBtn" onclick="deleteStreamFromDetail()">删除</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">关闭</button>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        // 全局变量
        let streams = [];
        let violations = [];
        let detectors = [];
        let currentDetailStreamId = null;
        let ws = null;
        let streamRefreshInterval = null;  // 视频流图片刷新定时器
        let pageRefreshInterval = null;    // 页面数据刷新定时器
        let detailRefreshInterval = null;  // 详情页图片刷新定时器
        let wsReconnectAttempts = 0;       // WebSocket重连次数
        const MAX_WS_RECONNECT_DELAY = 30000; // 最大重连延迟30秒
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadDetectors();
            loadStreams();
            loadViolations();
            connectWebSocket();
            
            // 定期刷新页面数据（每10秒）
            pageRefreshInterval = setInterval(() => {
                loadStreams();
                loadViolations();
            }, 10000);
        });
        
        // WebSocket连接 - 带指数退避重连
        function connectWebSocket() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            
            ws.onopen = function() {
                document.getElementById('connectionStatus').innerHTML = 
                    '<span class="live-dot"></span><span>已连接</span>';
                wsReconnectAttempts = 0; // 重置重连次数
            };
            
            ws.onclose = function() {
                document.getElementById('connectionStatus').innerHTML = 
                    '<span class="live-dot" style="background-color: var(--danger-color)"></span><span>断开连接</span>';
                
                // 指数退避重连
                wsReconnectAttempts++;
                const delay = Math.min(1000 * Math.pow(2, wsReconnectAttempts - 1), MAX_WS_RECONNECT_DELAY);
                console.log(`WebSocket ${wsReconnectAttempts}秒后重连...`);
                setTimeout(connectWebSocket, delay);
            };
            
            ws.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    if (data.type === 'violation') {
                        violations.unshift(data.data);
                        updateViolationCount();
                        renderViolations();
                    } else if (data.type === 'status') {
                        // 更新状态显示
                        updateStats();
                    } else if (data.type === 'connected') {
                        console.log('WebSocket连接成功:', data.data.message);
                    }
                } catch (e) {
                    console.error('WebSocket消息解析失败:', e);
                }
            };
            
            ws.onerror = function(error) {
                console.error('WebSocket错误:', error);
            };
        }
        
        // 加载检测器列表
        async function loadDetectors() {
            try {
                const res = await fetch('/api/detectors');
                const data = await res.json();
                console.log('检测器数据:', data);
                document.getElementById('debugInfo').innerHTML += '<br/>检测器: ' + JSON.stringify(data);
                detectors = data.value || [];
                
                // 填充选择框
                const select = document.getElementById('streamDetector');
                if (detectors.length > 0) {
                    select.innerHTML = detectors.map(d => 
                        `<option value="${d.id}">${d.name}</option>`
                    ).join('');
                } else {
                    select.innerHTML = '<option value="">暂无检测器</option>';
                }
                
                // 填充设置页面
                if (detectors.length > 0) {
                    document.getElementById('detectorsList').innerHTML = detectors.map(d => `
                        <div class="d-flex align-items-center justify-content-between p-2 border-bottom">
                            <span>${d.id} (${d.name})</span>
                            <span class="detector-tag">已注册</span>
                        </div>
                    `).join('');
                } else {
                    document.getElementById('detectorsList').innerHTML = '<div class="p-3 text-muted">暂无检测器</div>';
                }
            } catch (e) {
                console.error('加载检测器失败:', e);
                document.getElementById('debugInfo').innerHTML += '<br/>检测器错误: ' + e.message;
                document.getElementById('detectorsList').innerHTML = '<div class="p-3 text-danger">加载失败: ' + e.message + '</div>';
            }
        }
        
        // 加载视频流列表
        async function loadStreams() {
            try {
                const res = await fetch('/api/streams');
                const data = await res.json();
                console.log('API返回:', data);
                console.log('data.value:', data.value);
                console.log('data.value类型:', typeof data.value);
                
                document.getElementById('debugInfo').innerHTML += '<br/>API返回: ' + JSON.stringify(data).substring(0, 100);
                
                // 强制清空并重新赋值
                streams = [];
                if (data.value && Array.isArray(data.value)) {
                    streams = [...data.value];
                }
                console.log('最终 streams:', streams);
                document.getElementById('debugInfo').innerHTML += '<br/>最终streams=' + streams.length;
                
                renderStreams();
                updateStats();
                
                // 启动图片刷新定时器
                startStreamRefresh();
            } catch (e) {
                console.error('加载视频流失败:', e);
                document.getElementById('debugInfo').innerHTML += '<br/>错误: ' + e.message;
            }
        }
        
        // 视频流图片刷新 - 使用MJPEG实时流替代定时刷新截图
        function startStreamRefresh() {
            // MJPEG流是自动播放的，不需要定时刷新
            // 这个函数现在只用于更新状态显示
            console.log('MJPEG实时流模式：视频流会自动播放，无需定时刷新');
        }
        
        // 检查元素是否在视口内
        function isElementInViewport(el) {
            const rect = el.getBoundingClientRect();
            return (
                rect.top >= 0 &&
                rect.left >= 0 &&
                rect.bottom <= (window.innerHeight || document.documentElement.clientHeight) &&
                rect.right <= (window.innerWidth || document.documentElement.clientWidth)
            );
        }
        
        // 渲染视频流
        function renderStreams() {
            const grid = document.getElementById('streamsGrid');
            console.log('renderStreams 被调用, streams:', streams);
            document.getElementById('debugInfo').innerHTML += '<br/>render: ' + JSON.stringify(streams).substring(0, 80);
            
            if (!streams || streams.length === 0) {
                grid.innerHTML = `
                    <div class="col-12">
                        <div class="empty-state">
                            <i class="bi bi-camera-video-off"></i>
                            <p>暂无视频流，请点击右上角添加</p>
                        </div>
                    </div>
                `;
                return;
            }
            
            const html = streams.map(stream => `
                <div class="col-md-6 col-lg-4 mb-4">
                    <div class="stream-card">
                        <div class="stream-card-header">
                            <span class="fw-semibold">${stream.name || stream.id}</span>
                            <span class="stream-status ${stream.status === 'running' ? 'running' : 'stopped'}">
                                ${stream.status === 'running' ? '运行中' : '已停止'}
                            </span>
                        </div>
                        <div class="stream-card-body" onclick="showStreamDetail('${stream.id}')">
                            ${stream.status === 'running' 
                                ? `<img id="stream-img-${stream.id}" src="/api/streams/${stream.id}/live" alt="${stream.name}" style="width:100%;height:100%;object-fit:cover;" onerror="this.src='/api/streams/${stream.id}/snapshot'">`
                                : `<img id="stream-img-${stream.id}" src="/api/streams/${stream.id}/snapshot" alt="${stream.name}" style="width:100%;height:100%;object-fit:cover;">`
                            }
                            <div class="live-indicator" style="position: absolute; bottom: 0.5rem; left: 0.5rem;">
                                <span class="live-dot"></span>
                            </div>
                            <div id="stream-fps-${stream.id}" style="position: absolute; bottom: 0.5rem; right: 0.5rem; background: rgba(0,0,0,0.6); padding: 2px 8px; border-radius: 4px; font-size: 0.75rem;">
                                ${stream.status === 'running' ? 'LIVE' : 'OFFLINE'}
                            </div>
                        </div>
                        <div class="stream-card-footer">
                            <div class="stream-info">
                                <span><i class="bi bi-shield"></i> ${stream.detector_type || 'PPE'}</span>
                            </div>
                            <div class="btn-group">
                                ${stream.status === 'running' 
                                    ? `<button class="btn btn-outline-danger btn-sm" onclick="event.stopPropagation(); stopStream('${stream.id}')">
                                            <i class="bi bi-stop-fill"></i>
                                       </button>`
                                    : `<button class="btn btn-outline-success btn-sm" onclick="event.stopPropagation(); startStream('${stream.id}')">
                                            <i class="bi bi-play-fill"></i>
                                       </button>`
                                }
                                <button class="btn btn-outline-secondary btn-sm" onclick="event.stopPropagation(); showStreamDetail('${stream.id}')">
                                    <i class="bi bi-gear"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            `).join('');
            
            grid.innerHTML = html;
        }
        
        // 更新统计
        function updateStats() {
            document.getElementById('totalStreams').textContent = streams.length;
            document.getElementById('runningStreams').textContent = 
                streams.filter(s => s.status === 'running').length;
        }
        
        // 更新违规数
        function updateViolationCount() {
            document.getElementById('totalViolations').textContent = violations.length;
        }
        
        // 加载违规记录
        async function loadViolations() {
            try {
                const res = await fetch('/api/violations?limit=50');
                const data = await res.json();
                violations = data.value || [];
                renderViolations();
                updateViolationCount();
            } catch (e) {
                console.error('加载违规记录失败:', e);
            }
        }
        
        // 渲染违规记录
        function renderViolations() {
            const list = document.getElementById('violationsList');
            
            if (violations.length === 0) {
                list.innerHTML = `
                    <div class="empty-state">
                        <i class="bi bi-check-circle"></i>
                        <p>暂无违规记录</p>
                    </div>
                `;
                return;
            }
            
            list.innerHTML = violations.map(v => `
                <div class="violation-item">
                    <div class="violation-icon ${v.severity}">
                        <i class="bi bi-exclamation-triangle-fill"></i>
                    </div>
                    <div class="violation-content">
                        <div class="violation-title">${v.violation_type}</div>
                        <div class="violation-meta">
                            ${v.camera_name} • ${formatTime(v.timestamp)}
                        </div>
                    </div>
                    <span class="badge-severity badge-${v.severity}">${getSeverityText(v.severity)}</span>
                </div>
            `).join('');
        }
        
        // 格式化时间
        function formatTime(timestamp) {
            if (!timestamp) return '';
            if (timestamp.length >= 14) {
                return `${timestamp.slice(0,4)}-${timestamp.slice(4,6)}-${timestamp.slice(6,8)} ${timestamp.slice(8,10)}:${timestamp.slice(10,12)}`;
            }
            return timestamp;
        }
        
        // 严重程度文字
        function getSeverityText(severity) {
            const map = { 'high': '高', 'medium': '中', 'low': '低' };
            return map[severity] || severity;
        }
        
        // 添加视频流
        async function addStream() {
            const name = document.getElementById('streamName').value;
            const url = document.getElementById('streamUrl').value;
            const detector = document.getElementById('streamDetector').value;
            
            if (!name || !url) {
                alert('请填写完整信息');
                return;
            }
            
            const streamId = 'stream_' + Date.now();
            
            try {
                const res = await fetch('/api/streams', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        id: streamId,
                        name: name,
                        url: url,
                        detector_type: detector,
                        enabled: true,
                        status: 'stopped'
                    })
                });
                
                if (res.ok) {
                    bootstrap.Modal.getInstance(document.getElementById('addStreamModal')).hide();
                    document.getElementById('addStreamForm').reset();
                    loadStreams();
                }
            } catch (e) {
                alert('添加失败: ' + e.message);
            }
        }
        
        // 启动视频流
        async function startStream(streamId) {
            try {
                await fetch(`/api/streams/${streamId}/start`, { method: 'POST' });
                loadStreams();
            } catch (e) {
                alert('启动失败: ' + e.message);
            }
        }
        
        // 停止视频流
        async function stopStream(streamId) {
            try {
                await fetch(`/api/streams/${streamId}/stop`, { method: 'POST' });
                loadStreams();
            } catch (e) {
                alert('停止失败: ' + e.message);
            }
        }
        
        // 删除视频流
        async function deleteStream(streamId) {
            if (!confirm('确定要删除这个视频流吗？')) return;
            
            try {
                await fetch(`/api/streams/${streamId}`, { method: 'DELETE' });
                loadStreams();
            } catch (e) {
                alert('删除失败: ' + e.message);
            }
        }
        
        // 显示视频流详情
        async function showStreamDetail(streamId) {
            const stream = streams.find(s => s.id === streamId);
            if (!stream) return;
            
            currentDetailStreamId = streamId;
            document.getElementById('detailStreamName').textContent = stream.name;
            document.getElementById('detailStreamStatus').textContent = 
                stream.status === 'running' ? '运行中' : '已停止';
            document.getElementById('detailStreamStatus').className = 
                `stream-status ${stream.status === 'running' ? 'running' : 'stopped'}`;
            
            // 刷新图像
            document.getElementById('detailStreamImage').src = 
                `/api/streams/${streamId}/snapshot?${Date.now()}`;
            
            // 清理之前的定时器（如果存在）
            if (detailRefreshInterval) {
                clearInterval(detailRefreshInterval);
                detailRefreshInterval = null;
            }
            
            // 定期刷新详情页图片（每2秒）
            detailRefreshInterval = setInterval(() => {
                const img = document.getElementById('detailStreamImage');
                if (img) {
                    img.src = `/api/streams/${streamId}/snapshot?${Date.now()}`;
                }
            }, 2000);
            
            // 监听模态框关闭事件，清理定时器
            const modal = document.getElementById('streamDetailModal');
            modal.addEventListener('hidden.bs.modal', clearDetailRefreshInterval, { once: true });
            
            new bootstrap.Modal(modal).show();
        }
        
        // 清理详情页刷新定时器
        function clearDetailRefreshInterval() {
            if (detailRefreshInterval) {
                clearInterval(detailRefreshInterval);
                detailRefreshInterval = null;
                console.log('详情页刷新定时器已清理');
            }
        }
        
        // 从详情页删除
        function deleteStreamFromDetail() {
            if (currentDetailStreamId) {
                deleteStream(currentDetailStreamId);
                bootstrap.Modal.getInstance(document.getElementById('streamDetailModal')).hide();
            }
        }
        
        // 刷新视频流
        function refreshStreams() {
            loadStreams();
            loadViolations();
        }
        
        // 显示添加模态框
        function showAddStreamModal() {
            loadDetectors();
            new bootstrap.Modal(document.getElementById('addStreamModal')).show();
        }
        
        // 切换页面
        function showPage(page) {
            document.querySelectorAll('.sidebar-menu a').forEach(a => a.classList.remove('active'));
            event.target.closest('a').classList.add('active');
            
            ['streams', 'violations', 'stats', 'settings'].forEach(p => {
                document.getElementById('page-' + p).style.display = p === page ? 'block' : 'none';
            });
            
            if (page === 'stats') {
                loadStats();
            }
        }
        
        // 加载统计图表
        async function loadStats() {
            try {
                const res = await fetch('/api/violations/stats');
                const stats = await res.json();
                
                // 违规类型饼图
                new Chart(document.getElementById('chartByType'), {
                    type: 'doughnut',
                    data: {
                        labels: Object.keys(stats.by_type),
                        datasets: [{
                            data: Object.values(stats.by_type),
                            backgroundColor: ['#dc3545', '#ffc107', '#0d6efd', '#198754', '#6c757d']
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: {
                            legend: { position: 'right' }
                        }
                    }
                });
                
                // 摄像头柱状图
                new Chart(document.getElementById('chartByCamera'), {
                    type: 'bar',
                    data: {
                        labels: Object.keys(stats.by_camera),
                        datasets: [{
                            label: '违规数',
                            data: Object.values(stats.by_camera),
                            backgroundColor: '#0d6efd'
                        }]
                    },
                    options: {
                        responsive: true,
                        scales: {
                            y: { beginAtZero: true }
                        }
                    }
                });
            } catch (e) {
                console.error('加载统计失败:', e);
            }
        }
        
        // 页面卸载时清理所有定时器
        window.onunload = function() {
            if (streamRefreshInterval) clearInterval(streamRefreshInterval);
            if (pageRefreshInterval) clearInterval(pageRefreshInterval);
            if (detailRefreshInterval) clearInterval(detailRefreshInterval);
            if (ws) ws.close();
        };
    </script>
</body>
</html>
