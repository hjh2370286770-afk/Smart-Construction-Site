stream_width: 1280
stream_height: 720
stream_fps: 25
stream_bitrate: "1500k"
stream_queue_size: 20

# 进出场与清洗
exit_direction: "left"        # 车辆从画面左侧离场
exit_edge_threshold: 0.05     # 兼容旧参数，新逻辑中不再使用
exit_leading_edge_threshold: 0.80  # 检测框前缘越线阈值：bottom 用 y1，right 用 x2，left 用 x1
exit_wait_time: 3             # 前缘持续越线多久才判定出场（秒），前缘逻辑建议 2~5 秒
min_dwell_time: 5             # 车辆进场后最短在场时间（秒），防止同时进出场
wash_stop_time: 180
wash_zone:
  x1: 0.1
  y1: 0.3
  x2: 0.7
  y2: 0.8
plate_merge_threshold: 0.60

# 数据库与日志（每个项目独立，避免多实例冲突）
db_enabled: true
db_path: "vehicle_wash_JUNHE_106_01.db"
db_table_name: "vehicle_wash_records"
log_file: "full_video_test_v3_report_JUNHE_106_01.log"

# 显示窗口（多实例同时运行时建议对非主实例关闭）
no_display: false
